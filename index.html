<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be Mine?</title>
<style>
    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #ffe4e1;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        overflow: hidden;
    }
    .container {
        background-color: #ffffff;
        width: 90%;
        max-width: 500px;
        padding: 40px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        position: absolute;
        transition: opacity 0.5s ease;
    }
    .hidden {
        opacity: 0;
        pointer-events: none;
    }
    h1 {
        color: #ff477e;
        font-weight: bold;
        margin-bottom: 20px;
        font-size: 28px;
    }
    p {
        color: #555555;
        font-size: 16px;
        line-height: 1.8;
        margin-bottom: 30px;
    }
    .button-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        position: relative;
        height: 60px;
    }
    button {
        padding: 15px 35px;
        font-size: 18px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    #yes-btn {
        background-color: #ff477e;
        color: white;
        font-weight: bold;
    }
    #yes-btn:hover {
        background-color: #ff2a66;
    }
    #no-btn {
        background-color: #dddddd;
        color: #555555;
        position: absolute;
    }
</style>
</head>
<body>
    <div class="container" id="question-container">
        <h1>Will you be my girlfriend?</h1>
        <p>Selama ini kamu selalu ada di pikiranku. Maukah kamu jadi pacarku?</p>
        <div class="button-container">
            <button id="yes-btn" onclick="showResponse()">Mau!</button>
            <button id="no-btn" onmouseover="moveButton()" ontouchstart="moveButton()">Enggak</button>
        </div>
    </div>

    <div class="container hidden" id="response-container">
        <h1>Yey! ❤️</h1>
        <p>Makasih ya udah mau jadi pacar aku. Aku janji bakal bikin kamu bahagia!</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('no-btn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function showResponse() {
            document.getElementById('question-container').classList.add('hidden');
            document.getElementById('response-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
